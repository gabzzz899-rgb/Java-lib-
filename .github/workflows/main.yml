name: Build SO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Extract zip
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "Found zip: $ZIP"
          unzip "$ZIP" -d extracted

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build SO
        run: |
          SRC=$(find extracted -name "Android.mk" | grep "jni/Android.mk" | head -1)
          JNI_DIR=$(dirname "$SRC")
          MAIN_DIR=$(dirname "$JNI_DIR")
          echo "Building from: $MAIN_DIR"
          cd "$MAIN_DIR"
          ln -sf Il2Cpp.h jni/Hook/unity/IL2Cpp.h
          ln -sf Il2Cpp.cpp jni/Hook/unity/IL2Cpp.cpp
          if [ -d "jni/Hook/Struct" ] && [ ! -d "jni/Hook/struct" ]; then
            cp -r jni/Hook/Struct jni/Hook/struct
          fi
          ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_LIBS_OUT=$GITHUB_WORKSPACE/output

      - uses: actions/upload-artifact@v4
        with:
          name: libSoundSupport
          path: output/
