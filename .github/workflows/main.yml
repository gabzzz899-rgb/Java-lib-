name: Build SO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Extract zip
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "Found zip: $ZIP"
          unzip "$ZIP" -d extracted

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build SO
        run: |
          SRC=$(find extracted -name "Android.mk" | grep "jni/Android.mk" | head -1)
          JNI_DIR=$(dirname "$SRC")
          MAIN_DIR=$(dirname "$JNI_DIR")
          echo "Building from: $MAIN_DIR"
          cd "$MAIN_DIR"
          # Rename Il2Cpp.h to IL2Cpp.h (case fix, no duplicate)
          find . -name "Il2Cpp.h" | while read f; do
            mv "$f" "$(dirname "$f")/IL2Cpp.h"
          done
          # Same for Il2Cpp.cpp
          find . -name "Il2Cpp.cpp" | while read f; do
            mv "$f" "$(dirname "$f")/IL2Cpp.cpp"
          done
          ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_LIBS_OUT=$GITHUB_WORKSPACE/output

      - uses: actions/upload-artifact@v4
        with:
          name: libSoundSupport
          path: output/
